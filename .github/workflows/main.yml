name: Merlin-Cannon Q - Stability Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl wget git build-essential zip bc libssl-dev bison flex libelf-dev libgnutls28-dev python3 python3-dev
          mkdir -p $GITHUB_WORKSPACE/work
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 --depth=1

      - name: Clone Source (Cannon-Q-OSS)
        run: |
          cd $GITHUB_WORKSPACE/work
          # Menarik branch cannon-q-oss secara utuh
          git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b cannon-q-oss android-kernel --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          
          # Bersihkan lingkungan
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          
          # Membuat direktori output secara manual
          mkdir -p out

          # MENGGUNAKAN CANNON_DEFCONFIG (Sesuai isi repo MiCode)
          echo "Memulai konfigurasi dengan cannon_defconfig..."
          make O=out ARCH=arm64 cannon_defconfig
          
          # Kustomisasi & Patch Anti-Reboot
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Reboot9-V1-Stable"/g' out/.config
          echo "CONFIG_MTK_WATCHDOG_REBOOT_LEVEL=0" >> out/.config
          echo "CONFIG_PANIC_TIMEOUT=0" >> out/.config
          
          # Sinkronisasi konfigurasi akhir
          make O=out ARCH=arm64 olddefconfig
          
          # Proses Kompilasi Utama
          make -j$(nproc --all) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w -Wno-error=address -Wno-error=array-bounds -Wno-error=dangling-pointer" \
              LDFLAGS="--allow-multiple-definition"

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          
          # Cari file Image.gz hasil build
          IMAGE=$(find android-kernel/out/arch/arm64/boot -name "Image.gz*" -type f | head -n 1)
          
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            # Script installer otomatis untuk Merlin/Lancelot
            printf "properties() { '\nkernel.string=Merlin-Reboot9-V1\ndo.devicecheck=1\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=merlin\ndevice.name2=lancelot\n'; }\nblock=/dev/block/by-name/boot;\nis_slot_device=0;\nramdisk_compression=auto;\npatch_vbmeta_flag=auto;\n. tools/ak3-core.sh;\nsplit_boot;\nflash_boot;\nflash_dtbo;\n" > anykernel.sh
            zip -r9 "../Merlin-Reboot9-Flashable.zip" *
          else
            echo "Gagal: Kernel Image tidak ditemukan!"
            exit 1
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Merlin-Reboot9-V1
          path: work/Merlin-Reboot9-Flashable.zip
