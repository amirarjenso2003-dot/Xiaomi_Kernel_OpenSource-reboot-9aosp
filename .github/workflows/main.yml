- name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper

          # Mencari file defconfig yang benar secara otomatis
          # Jika merlin_defconfig tidak ada, dia akan mencoba cannon_defconfig
          if [ -f arch/arm64/configs/merlin_defconfig ]; then
              CONF=merlin_defconfig
          elif [ -f arch/arm64/configs/cannon_defconfig ]; then
              CONF=cannon_defconfig
          else
              # Jika dua-duanya tidak ada, cari file apa saja yang mengandung kata 'merlin'
              CONF=$(ls arch/arm64/configs/ | grep -i merlin | head -n 1)
          fi

          echo "Menggunakan konfigurasi: $CONF"
          make O=out ARCH=arm64 $CONF
          
          # Identitas Build
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Reboot9-V1-Stable"/g' out/.config
          
          # Tweak Anti-Reboot
          echo "CONFIG_MTK_WATCHDOG_REBOOT_LEVEL=0" >> out/.config
          echo "CONFIG_PANIC_TIMEOUT=0" >> out/.config
          
          make O=out ARCH=arm64 olddefconfig
          
          # Proses Kompilasi
          make -j$(nproc --all) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w -Wno-error=address -Wno-error=array-bounds" \
              LDFLAGS="--allow-multiple-definition"
